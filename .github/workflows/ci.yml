name: Validar módulos 2 e 3
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
